<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neon Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0b0b0f;
color:#fff;
overflow-x:hidden;
}

/* HERO */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:
radial-gradient(circle at top,#6a00ff33,transparent),
radial-gradient(circle at bottom,#00d4ff22,transparent),
#0b0b0f;
padding:20px;
}

.hero h1{
font-size:3rem;
margin-bottom:15px;
background:linear-gradient(90deg,#7f00ff,#00d4ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero p{
color:#aaa;
max-width:600px;
margin-bottom:30px;
}

.btn{
padding:14px 28px;
border-radius:50px;
background:linear-gradient(90deg,#7f00ff,#00d4ff);
color:white;
text-decoration:none;
font-weight:600;
transition:0.3s;
}

.btn:hover{
transform:scale(1.1);
box-shadow:0 0 25px #7f00ff66;
}

/* CARDS */
section{
padding:80px 20px;
text-align:center;
}

.cards{
display:flex;
gap:20px;
justify-content:center;
flex-wrap:wrap;
margin-top:40px;
}

.card{
background:#15151d;
padding:20px;
border-radius:15px;
width:250px;
border:1px solid #ffffff10;
transition:0.3s;
}

.card:hover{
transform:translateY(-10px);
border-color:#7f00ff;
}
</style>
</head>

<body>

<section class="hero">
<h1>Neon Studio ⚡</h1>
<p>Uma landing page futurista feita só pra demonstração. Simples, bonita e rápida.</p>
<a href="#" class="btn">Explorar</a>
</section>

<section>
<h2>Serviços</h2>

<div class="cards">

<div class="card">
<h3>Design</h3>
<p>Interfaces modernas e bonitas.</p>
</div>

<div class="card">
<h3>Sites</h3>
<p>Landing pages rápidas e responsivas.</p>
</div>

<div class="card">
<h3>Branding</h3>
<p>Identidade visual forte e marcante.</p>
</div>

</div>
</section>

</body>
</html>
